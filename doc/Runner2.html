<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Runner UI v1.4 - Focus on Distance</title>
    <style>
        :root {
            --bg-color: #000000;
            --accent-color: #CCFF00; /* 荧光绿 */
            --text-main: #FFFFFF;
            --text-dim: #888888;
            --danger-color: #FF3B30;
        }

        body {
            margin: 0; background-color: #222;
            font-family: 'Inter', sans-serif;
            display: flex; justify-content: center; align-items: center; height: 100vh;
            color: var(--text-main);
        }

        .phone-frame {
            width: 375px; height: 780px;
            background-color: var(--bg-color);
            border-radius: 40px; border: 8px solid #333;
            overflow: hidden; display: flex; flex-direction: column;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8);
        }

        /* 跑步界面核心布局 */
        .tracking-page {
            display: flex; flex-direction: column; height: 100%; padding: 40px 20px; box-sizing: border-box;
        }

        /* 1. 距离 - 最突出 */
        .distance-section {
            flex: 2; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
        }
        .dist-label { color: var(--text-dim); letter-spacing: 4px; font-size: 14px; margin-bottom: 10px; }
        .dist-value { color: var(--accent-color); font-size: 120px; font-weight: 900; line-height: 0.9; }
        .dist-unit { color: var(--accent-color); font-size: 24px; font-weight: 700; margin-top: 10px; }

        /* 2. 时间与步频 - 并列 */
        .sub-stats-section {
            flex: 1; display: flex; justify-content: space-between; align-items: center;
            border-top: 1px solid #222; border-bottom: 1px solid #222; margin: 20px 0;
        }
        .stat-group { flex: 1; text-align: center; }
        .stat-group:first-child { border-right: 1px solid #222; }
        .stat-label { color: var(--text-dim); font-size: 12px; margin-bottom: 8px; }
        .stat-value { font-size: 36px; font-weight: 700; font-family: 'Courier New', Courier, monospace; }

        /* 3. 下一段进度条 */
        .progress-section {
            flex: 0.8; display: flex; flex-direction: column; justify-content: center;
        }
        .next-info { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-dim); margin-bottom: 10px; }
        .progress-bar-bg { width: 100%; height: 6px; background: #222; border-radius: 3px; overflow: hidden; }
        .progress-bar-fill { width: 65%; height: 100%; background: var(--accent-color); box-shadow: 0 0 10px var(--accent-color); }

        /* 4. 操作区 */
        .controls-section {
            flex: 1; display: flex; justify-content: center; align-items: center;
        }
        .pause-btn {
            width: 90px; height: 90px; border-radius: 45px;
            background: var(--danger-color); color: white;
            display: flex; justify-content: center; align-items: center;
            font-weight: 900; font-size: 18px; cursor: pointer;
        }
    </style>
</head>
<body>

<div class="phone-frame">
    <div class="tracking-page">
        <div class="distance-section">
            <div class="dist-label">DISTANCE</div>
            <div class="dist-value">12.8</div>
            <div class="dist-unit">KILOMETERS</div>
        </div>

        <div class="sub-stats-section">
            <div class="stat-group">
                <div class="stat-label">TIME</div>
                <div class="stat-value">01:04:22</div>
            </div>
            <div class="stat-group">
                <div class="stat-label">ACTUAL SPM</div>
                <div class="stat-value" style="color: var(--accent-color);">182</div>
            </div>
        </div>

        <div class="progress-section">
            <div class="next-info">
                <span>NEXT: 160 SPM (WALK)</span>
                <span>01:45 LEFT</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill"></div>
            </div>
            <div style="font-size: 10px; color: #444; margin-top: 8px; text-align: center;">
                AUTO-SWITCH TRACK ENABLED
            </div>
        </div>

        <div class="controls-section">
            <div class="pause-btn">PAUSE</div>
        </div>
    </div>
</div>

</body>
</html>
